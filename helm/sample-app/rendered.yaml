---
# Source: sample-app/templates/deployment.yaml
apiVersion: apps/v1 
kind: Deployment
metadata:
  name: sample-app
  namespace: app

spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template: 
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - name: sample-app
          image: "k8s-troubleshooting-app:1.0"
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
