apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent
  namespace: app

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-agent
  namespace: app

rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-agent
  namespace: app

subjects:
  - kind: ServiceAccount
    name: ai-agent
    namespace: app

roleRef:
  kind: Role
  name: ai-agent
  apiGroup: rbac.authorization.k8s.io