apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent

spec: 
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent

  template:
    metadata:
      labels:
        app: ai-agent

    spec: 
      serviceAccountName: ai-agent
      containers:
        - name: ai-agent
          image: "{{ .Values.image.repository}}:{{ .Values.image.tag}}"
          imagePullPolicy: {{ .Values.image.pullPolicy}}
          ports:
            - containerPort: 8000
          env:
            - name: OPENAI_API_KEY
              value: {{ .Values.openaiApiKey | quote }}
    